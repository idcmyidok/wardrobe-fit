# PR마다 lint·타입·단위 테스트·빌드와 E2E(로컬 Supabase)를 돌린다(PROJECT_SPEC.md 22장 2·13단계).
name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: 빌드(가짜 비밀 값으로)
        run: npm run build
        env:
          ANTHROPIC_API_KEY: sk-ant-bundle-check-not-a-real-key
          GEMINI_API_KEY: gemini-bundle-check-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: service-role-bundle-check-not-a-real-key
      - name: 비밀 값이 브라우저 번들에 없는지 검사
        run: npm run check:bundle
        env:
          ANTHROPIC_API_KEY: sk-ant-bundle-check-not-a-real-key
          GEMINI_API_KEY: gemini-bundle-check-not-a-real-key
          SUPABASE_SERVICE_ROLE_KEY: service-role-bundle-check-not-a-real-key

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: 로컬 Supabase 시작(마이그레이션 적용)
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,supavisor,postgres-meta
      - name: 로컬 Supabase 접속 정보를 환경 변수로
        run: |
          eval "$(supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
            echo "E2E_MAILPIT_URL=$MAILPIT_URL"
          } >> "$GITHUB_ENV"
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
