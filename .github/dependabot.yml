# 의존성 업데이트. PR은 develop을 대상으로 연다(브랜치 전략).
# 알림이 쌓이지 않게 한 달에 한 번, 종류별로 PR 하나로 묶는다. 큰 버전(major)은 호환성 확인이 필요해서 자동 PR을 만들지 않는다.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
