<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이메일 인증</title>
</head>
<body style="margin:0;padding:0;background:#f4f2ee;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">버튼 하나만 누르면 가입이 끝나요.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f2ee;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;background:#fbfaf8;border:1px solid #d3cec5;border-radius:6px;">
        <tr>
          <td style="padding:28px 32px 0 32px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;font-weight:700;letter-spacing:0.2px;color:#4a5134;">
            Wardrobe Fit
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 0 32px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
            <h1 style="margin:0 0 12px 0;font-size:22px;line-height:30px;font-weight:700;color:#1c1b19;">Wardrobe Fit에 오신 걸 환영해요</h1>
            <p style="margin:0;font-size:15px;line-height:24px;color:#42403b;">가입해 주셔서 고마워요. 아래 버튼을 누르면 이메일 인증이 끝나고 바로 내 옷장으로 이동해요.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:28px 32px 8px 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="border-radius:6px;background:#5b6340;">
                  <a href="{{ .ConfirmationURL }}" target="_blank" style="display:inline-block;padding:14px 28px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:6px;">이메일 인증하기</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 32px 28px 32px;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;line-height:20px;color:#77726a;">
            링크는 한 번만, 1시간 동안 쓸 수 있어요.<br>
            버튼이 눌리지 않으면 아래 주소를 복사해 브라우저에 붙여 넣어 주세요.<br>
            <a href="{{ .ConfirmationURL }}" style="color:#5b6340;word-break:break-all;">{{ .ConfirmationURL }}</a>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px;border-top:1px solid #e5e1da;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;line-height:18px;color:#948e84;">
            내 옷장을 기록하고, 새 옷을 사기 전에 사이즈를 비교해 보세요.<br>
            직접 가입하지 않았다면 이 메일은 무시하셔도 괜찮아요.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
