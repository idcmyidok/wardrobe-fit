<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>비밀번호 재설정 안내</title>
</head>
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;">
  <tr>
    <td align="center" style="padding:40px 20px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;word-break:keep-all;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;">
        <tr>
          <td style="padding:0 0 24px 0;border-bottom:2px solid #1c1b19;font-size:18px;font-weight:800;color:#1c1b19;">Wardrobe Fit</td>
        </tr>
        <tr>
          <td style="padding:36px 0 0 0;">
            <p style="margin:0 0 16px 0;font-size:22px;line-height:32px;font-weight:700;color:#1c1b19;">비밀번호 재설정 안내</p>
            <p style="margin:0;font-size:15px;line-height:25px;color:#42403b;">비밀번호 재설정 요청이 접수되었습니다. 아래 버튼을 눌러 새 비밀번호를 설정해 주세요.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 0 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f4f2ee;">
              <tr>
                <td style="padding:14px 16px;font-size:14px;line-height:22px;color:#5c5852;width:72px;">요청 계정</td>
                <td style="padding:14px 16px 14px 0;font-size:14px;line-height:22px;color:#1c1b19;font-weight:600;word-break:break-all;">{{ .Email }}</td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:32px 0 0 0;">
            <a href="{{ .ConfirmationURL }}" target="_blank" style="display:block;padding:15px 0;background:#1c1b19;border-radius:4px;font-size:16px;font-weight:700;color:#ffffff;text-align:center;text-decoration:none;">비밀번호 재설정</a>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 0 0 0;font-size:13px;line-height:21px;color:#77726a;">
            링크는 발송 후 1시간 동안 유효하며, 한 번만 사용할 수 있습니다.<br>
            본인이 요청하지 않았다면 이 메일을 무시해 주세요. 비밀번호는 변경되지 않습니다.
          </td>
        </tr>
        <tr>
          <td style="padding:40px 0 0 0;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #e5e1da;">
              <tr>
                <td style="padding:20px 0 0 0;font-size:12px;line-height:19px;color:#948e84;">
                  본 메일은 발신 전용으로 회신되지 않습니다.<br>
                  버튼이 동작하지 않으면 아래 주소를 브라우저에 붙여 넣어 주세요.<br>
                  <a href="{{ .ConfirmationURL }}" style="color:#948e84;word-break:break-all;">{{ .ConfirmationURL }}</a><br><br>
                  &copy; Wardrobe Fit
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
